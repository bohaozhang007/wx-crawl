crawl:
  # TikHub V2 历史列表；legacy 仅供手动回滚旧微信读书后端。
  history_backend: tikhub
  # 每轮所有 TikHub 付费请求总上限（含身份、列表、正文兜底），不自动重试。
  tikhub_max_requests: 120
  # 本次输入 CSV 路径。可以使用任意列结构，程序会扫描所有单元格中的公众号文章链接。
  # 相对路径以项目顶层目录为基准。
  # 识别出的公众号会更新到 account_sources.csv；输入的具体文章也会加入本次抓取。
  input_csv: input_template.csv

  # 抓取模式：
  # incremental：增量模式，只抓取上次成功文章到最新文章之间的新增内容。
  #              首次发现的新公众号只检查最新 articles_per_account 篇。
  # window：窗口模式，只检查历史列表最新 articles_per_account 篇。
  mode: incremental

  # window 模式用于所有公众号；incremental 模式仅用于首次发现的新公众号。
  # 必须大于 0。
  # 已存在的文章会按 URL 去重，不会重复抓取。
  # 输入 CSV 与 account_sources.csv 中的示例文章不受窗口或历史断点限制。
  articles_per_account: 30

  # incremental 模式最多向前回溯的天数，默认 1 天；window 模式忽略此项。
  incremental_max_days: 1

labeling:
  # 为推理过程和 JSON 标签留足输出空间，沿用已通过抽样的上限。
  max_output_tokens: 16384
  # 默认继承 Hermes Agent 当前的 provider、model、base_url 和对应 API Key。
  # 以下三项留空即可；只有希望打标使用不同模型时才填写。
  # 环境变量 LABEL_PROVIDER、LABEL_MODEL、LABEL_BASE_URL、LABEL_API_KEY 优先级最高。
  provider: ""
  model: ""
  base_url: ""

  # 同时打标的文章数。第一版建议保持较小并发。
  concurrency: 2

  # 单次模型请求的超时时间和失败后的重试次数。
  timeout_seconds: 180
  max_retries: 2

attachments:
  # 始终保留识别到的附件原始链接；可直接访问时同时下载到文章目录 attachments/。
  timeout_seconds: 30
  max_size_mb: 50

deadline_reminder:
  # 仅对打标确认的明确截止时间创建提醒；模糊或缺失时间不会调度。
  enabled: true
  days_before: 14
  timezone: Asia/Shanghai
  retry_minutes: 30
  max_attempts: 3

importance_alert:
  # 每批新增文章打标后，立即在钉钉群中提醒高重要度文章。
  enabled: true
  mention_user_ids:
    # 由钉钉通讯录接口根据钉钉号 il3fb51 解析出的应用内部 userId。
    - "171036101939908716"
