profile_version: "1.3"

matching_policy:
  require_task_scope: true
  supporting_terms_are_sufficient: false
  match_all_confirmed_domains: true
  inheritance:
    robot_implies_embodied_ai: false
    embodied_ai_implies_robot: false
    robotic_arm_implies_robot: false
    large_model_implies_embodied_ai: false
    drone_implies_aerospace: false
  excluded_task_families:
    satellite_application:
      scope: [卫星平台, 卫星载荷, 卫星数据, 遥感, 卫星通信, 卫星导航, 星座]
      rule: >-
        当课题核心对象是卫星本体或卫星数据/遥感/通信/导航应用时，整体不属于目标范围；
        即使任务使用人工智能、智能体、多模态大模型或其他目标技术作为数据处理和赋能工具，
        也不得据此标记大模型、具身智能或空天。
      exception: >-
        任务明确研究太空机器人或机械臂，并以在轨/太空装配、制造、建造、维修、维护、
        检修、抓取、操作或服务为核心研究对象时不适用本排除项；应按机器人、机械臂及
        实际成立的空天方向正常判断。

domains:
  无人机:
    direct_terms: [无人机, 无人飞行器, UAV, drone]
    task_patterns: [无人机系统, 无人机集群, 飞控系统, 无人机自主导航, 无人机载荷]
    supporting_terms: [低空飞行, 低空系统, 飞行平台, 空地协同]
    insufficient_terms: [低空, 航空器, 飞行, 通航]
    exclusions: [有人机, 普通航空运输]

  具身智能:
    direct_terms: [具身智能, embodied AI, embodied intelligence, 具身智能体]
    task_patterns: [具身感知, 具身认知, 具身决策, 具身交互, 具身智能系统]
    supporting_terms: [智能体, 世界模型, 视觉语言动作模型, VLA]
    insufficient_terms: [智能体, 多模态, 人形机器人, 世界模型]
    exclusions: [纯软件智能体, 未涉及物理交互的流程自动化]

  大模型:
    direct_terms: [大模型, 大语言模型, LLM, foundation model, 基础模型, 多模态大模型]
    task_patterns: [大模型训练, 大模型推理, 大模型微调, 大模型评测, 行业大模型, 基础模型研发]
    supporting_terms: [生成式人工智能, 多模态, 参数模型, 预训练模型]
    insufficient_terms: [模型, 人工智能, 算法, GPT]
    exclusions: [普通数学模型, 统计模型, 模型产品名称但任务不研究模型]

  空天:
    direct_terms: [空天, 航空航天, 航天, aerospace, spaceflight]
    task_patterns: [航天器, 运载火箭, 空间飞行器, 深空探测, 在轨服务, 航空航天系统]
    supporting_terms: [火箭, 飞船, 空间站, 临近空间]
    insufficient_terms: [空间, 天空, 航空, 飞行]
    exclusions: [数据空间, 网络空间, 地理空间, 卫星数据应用, 卫星遥感应用, 卫星通信应用, 卫星导航应用, 星座应用]

  机器人:
    direct_terms: [机器人, robot, 人形机器人, 四足机器人, 工业机器人, 服务机器人]
    task_patterns: [机器人控制, 机器人感知, 机器人导航, 机器人操作, 机器人系统]
    supporting_terms: [自主移动, 人机协作, 运动控制, 智能装备]
    insufficient_terms: [自动化, 智能装备, 无人系统, 机械设备]
    exclusions: [软件机器人, RPA, 聊天机器人]

  机械臂:
    direct_terms: [机械臂, 机器人臂, robotic arm, manipulator]
    task_patterns: [机械臂控制, 机械臂操作, 机械臂抓取, 机械臂规划, 多臂协作]
    supporting_terms: [末端执行器, 抓取, 操作臂, 运动学]
    insufficient_terms: [手臂, 抓取, 执行器, 运动学]
    exclusions: [人体手臂, 非机器人语境的机械结构]

geography_policy:
  allowed: [national, beijing, zhejiang]
  include_subordinate_cities_and_districts: true
  other_region_special_programs: exclude_even_if_nationally_sponsored
  unknown: review
  evidence_required: true
  applies_to: [科研项目申请, 科研指南申请]
